<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Guest check-in — Ani's Birthday Party.">
  <meta name="theme-color" content="#5A1B28">
  <title>Check In — Ani's Birthday</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,450;0,9..144,600;0,9..144,700;1,9..144,500&family=Caveat:wght@500;600;700&family=Special+Elite&display=swap" rel="stylesheet">

  <!-- Shared styles (one level up from checkin/) -->
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<!-- Film-grain texture overlay -->
<div class="grain" aria-hidden="true"></div>

<main class="checkin-page">
  <div class="checkin-card" id="checkinCard">
    <p class="checkin-card__eyebrow">at the door</p>

    <!-- Content area — populated by checkin.js -->
    <div id="checkinContent" aria-live="polite" aria-atomic="true">
      <p class="checkin-card__name">Loading…</p>
    </div>
  </div>
</main>

<!-- Scripts — paths relative to checkin/ folder -->
<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/components/decorations.js"></script>
<script src="checkin.js"></script>
</body>
</html>
