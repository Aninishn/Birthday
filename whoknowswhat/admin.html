<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guest List — Ani's Birthday</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,450;0,9..144,600;0,9..144,700;1,9..144,500&family=Caveat:wght@500;600;700&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="grain"></div>

<div class="admin-page">

  <div class="admin-gate" id="adminGate">
    <p class="eyebrow">private page</p>
    <p style="font-family:var(--font-hand); font-size:1.4rem; color:var(--burgundy);">enter the key to see your guest list</p>
    <input type="password" id="adminKeyInput" placeholder="admin key">
    <button class="postcard__submit" id="adminGateBtn" style="max-width:200px; margin:0 auto;">unlock</button>
    <p class="checkin-error" id="adminGateError" style="display:none;">wrong key — try again</p>
  </div>

  <div id="adminDashboard" style="display:none;">
    <div class="admin-header">
      <p class="eyebrow">private · just for you</p>
      <h1 class="section-title">The Guest List</h1>
    </div>

    <div class="admin-summary" id="adminSummary"></div>

    <div class="guest-list" id="guestList"></div>

    <div class="qr-panel">
      <h2 class="section-title" style="font-size:1.4rem;">Check-in QR codes</h2>
      <div class="qr-grid" id="qrGrid"></div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="config.js"></script>
<script src="api.js"></script>
<script src="decorations.js"></script>
<script src="admin.js"></script>
</body>
</html>
